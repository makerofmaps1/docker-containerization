version: '3.8'

services:
  dashboard:
    build: ./dashboard
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=${DB_HOST:-db-tunnel}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # AWS credentials (local dev only - cloud deployments use IAM roles)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=${AWS_REGION}
      - USE_SECRETS_MANAGER=${USE_SECRETS_MANAGER}
      - AWS_SECRET_NAME=${AWS_SECRET_NAME}
      - S3_BUCKET=${S3_BUCKET}
      - S3_KEY=${S3_KEY}
    volumes:
      - ./dashboard:/app
    restart: unless-stopped
  db-tunnel:
    build: ./docker/tunnel
    # Mount your private key at docker/tunnel/key.pem or override with SSH_KEY_PATH
    volumes:
      - ./docker/tunnel/key.pem:/secrets/key.pem:ro
    environment:
      - EC2_HOST=${EC2_HOST}
      - SSH_USER=${SSH_USER}
      - RDS_HOST=${RDS_HOST}
      - RDS_PORT=${RDS_PORT:-5432}
      - SSH_KEY_PATH=/secrets/key.pem
    restart: unless-stopped
